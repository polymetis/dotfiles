# tmux — managed by chezmoi (home/dot_tmux.conf).

# --- General ----------------------------------------------------------------
set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",*:RGB"      # truecolor passthrough (carries italics too)
set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  history-limit 50000
set  -g  focus-events on
setw -g  mode-keys vi
set  -g  set-clipboard on

# --- Keys -------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Splits inherit the current directory; | and - are easier to remember.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# Pane navigation (C-h/j/k/l) is handled by vim-tmux-navigator, seamless with nvim.

# --- Status bar (tokyonight, hand-rolled — no theme-plugin dependency) ------
set  -g  status-position bottom
set  -g  status-interval 5
set  -g  status-style "bg=#1a1b26,fg=#c0caf5"
set  -g  status-left-length 30
set  -g  status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#c0caf5] "
set  -g  status-right-length 40
set  -g  status-right "#[fg=#565f89]%a %d %b  #[fg=#7aa2f7,bold]%H:%M "
setw -g  window-status-format         "#[fg=#565f89] #I:#W "
setw -g  window-status-current-format "#[bg=#292e42,fg=#bb9af7,bold] #I:#W "
set  -g  pane-border-style        "fg=#292e42"
set  -g  pane-active-border-style "fg=#7aa2f7"
set  -g  message-style "bg=#292e42,fg=#c0caf5"
set  -g  mode-style    "bg=#7aa2f7,fg=#1a1b26"

# --- Plugins (tpm) ----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Bootstrap tpm + plugins on first launch (idempotent).
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
